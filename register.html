<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta | Sin Azúcar</title>

    <link
        rel="stylesheet"
        href="./register.css"
    >
</head>

<body>

    <main class="register-page">

        <section class="register-card">

            <div class="register-logo">
                🍎
            </div>

            <p class="register-label">
                MI RETO PERSONAL
            </p>

            <h1>
                Crear cuenta
            </h1>

            <p class="register-description">
                Crea tu cuenta para guardar tu progreso.
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword"
                            class="show-password"
                        >
                            👁️
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repite tu contraseña"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="showConfirmPassword"
                            class="show-password"
                        >
                            👁️
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    id="registerBtn"
                    class="register-button"
                >
                    Crear cuenta
                </button>

            </form>

            <div
                id="message"
                class="message"
            ></div>

            <div class="separator">
                <span>o</span>
            </div>

            <p class="login-text">
                ¿Ya tienes cuenta?

                <a href="./login.html">
                    Iniciar sesión
                </a>
            </p>

        </section>

    </main>

    <script
        type="module"
        src="./register.js"
    ></script>

</body>

</html>
