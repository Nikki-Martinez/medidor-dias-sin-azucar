<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Sin Azúcar</title>

    <link
        rel="icon"
        type="image/png"
        href="./assets/icons/icon.png"
    >

    <link
        rel="stylesheet"
        href="login.css"
    >
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">
                🍎
            </div>

            <p class="login-label">
                MI RETO PERSONAL
            </p>

            <h1>
                Sin Azúcar
            </h1>

            <p class="login-description">
                Inicia sesión para continuar con tu progreso.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword"
                            class="show-password"
                            aria-label="Mostrar contraseña"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    id="loginBtn"
                    class="login-button"
                >
                    Iniciar sesión
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="separator">
                <span>o</span>
            </div>


            <p class="register-text">

                ¿Todavía no tienes una cuenta?

                <a href="register.html">
                    Crear cuenta
                </a>

            </p>

        </section>

    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
